version: '3.8'
services:
  hostel:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7011:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SEED_SECRET=${ADMIN_SEED_SECRET}
    env_file:
      - ./frontend/.env
    restart: unless-stopped
