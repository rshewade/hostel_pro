version: '3.8'
services:
  hostel:
    image: ${FRONTEND_IMAGE:-ghcr.io/hostel_pro-frontend:latest}
    ports:
      - "7011:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SEED_SECRET=${ADMIN_SEED_SECRET}
    env_file:
      - .env.prod
    restart: unless-stopped
